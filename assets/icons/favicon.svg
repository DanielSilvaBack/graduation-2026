<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1f4a"/>
      <stop offset="100%" stop-color="#050816"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Sphere wireframe lines (simplified) -->
  <!-- Outer circle -->
  <circle cx="32" cy="32" r="20" stroke="#00F5FF" stroke-width="0.8" stroke-opacity="0.7" fill="none"/>
  <!-- Horizontal ellipses -->
  <ellipse cx="32" cy="32" rx="20" ry="7" stroke="#3A86FF" stroke-width="0.6" stroke-opacity="0.5" fill="none"/>
  <ellipse cx="32" cy="32" rx="20" ry="14" stroke="#3A86FF" stroke-width="0.5" stroke-opacity="0.35" fill="none"/>
  <!-- Vertical line -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="#00F5FF" stroke-width="0.5" stroke-opacity="0.4"/>
  <!-- Diagonal lines -->
  <line x1="14" y1="22" x2="50" y2="42" stroke="#64FFDA" stroke-width="0.4" stroke-opacity="0.3"/>
  <line x1="14" y1="42" x2="50" y2="22" stroke="#64FFDA" stroke-width="0.4" stroke-opacity="0.3"/>

  <!-- Center dot glow -->
  <circle cx="32" cy="32" r="3" fill="#00F5FF" fill-opacity="0.9"/>
  <circle cx="32" cy="32" r="5" fill="#00F5FF" fill-opacity="0.15"/>

  <!-- "DS" letters subtle -->
  <text x="32" y="36" font-family="monospace" font-size="8" fill="white" fill-opacity="0.85" text-anchor="middle" font-weight="bold">DS</text>
</svg>
